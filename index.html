<!DOCTYPE html>
<html lang="es-AR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tarjeta · Mi charla</title>

  <!-- Esta sola línea engancha el CSS externo. Sin esto, no se ve nada. -->
  <link rel="stylesheet" href="Pagina.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- link: conecta una biblioteca externa de Font Awesome para poder usar iconos como Facebook, Instagram, Twitter, etc. -->
</head>


<body>
  <!--Encabezado-->
  <main> <!-- main: contiene el contenido principal del sitio -->
    <div class="Contenedor"> <!-- div: contenedor general para agrupar elementos -->
      <section class="tarjeta-principal"> <!-- section: agrupa contenido relacionado en una sección -->
        <article class="tarjeta--clara"> <!-- article: bloque de contenido independiente -->
          <img class="tarjeta__logo" src="./img/OtroescudoLIV.webp" alt="Logo del Liverpool Football Club">
          <!-- img: muestra una imagen -->

          <p class="tarjeta__curso">Taller WebI + Clubes TED-Ed</p> <!-- p: crea un párrafo -->
          <h1 class="tarjeta__nombre">Thiago Collihuin</h1> <!-- h1: título principal de la página -->
          <p class="tarjeta__frase">"You never walk alone."</p> <!-- p: párrafo para la frase -->
        </article>
      </section>

      <section class="tarjeta"> <!--segunda seccion-->
        <article class="tarjeta--oscura"> <!-- article: primera tarjeta -->
          <h2 class="tarjeta__pregunta">Partidos Históricos</h2> <!-- h2: subtítulo -->
          <p class="tarjeta__respuesta"> <!-- p: contenedor de la imagen -->
            <img src="./img/fondo portada.jpg" height="220" alt="Partidos" class="imagenes-liverpool">
            <!-- img: imagen del contenido -->
          </p>
          <p> <!-- p: contiene el enlace -->
            <a href="./primerapag.html" class="tarjeta__respuesta--enlace">Entrar</a>
            <!-- a: enlace para abrir otra página -->
          </p>
        </article>

        <article class="tarjeta--oscura"> <!--segunda tarjeta-->
          <h2 class="tarjeta__pregunta">Explicación de por qué es histórico</h2>
          <p class="tarjeta__respuesta">
            <img src="./img/Explicacion del partido.jpg" height="220" alt="Explicación de los partidos"
              class="imagenes-liverpool">
          </p>
          <p>
            <a href="./segundapag.html" class="tarjeta__respuesta--enlace">Entrar</a>
          </p>
        </article>

        <article class="tarjeta--oscura"> <!-- article: tercera tarjeta -->
          <h2 class="tarjeta__pregunta">Relación con mi charla TED</h2>
          <p class="tarjeta__respuesta">
            <img src="./img/otracharlated.png" height="220" alt="Charla TED" class="imagenes-liverpool">
          </p>
          <p>
            <a href="./tercerapag.html" class="tarjeta__respuesta--enlace">Entrar</a>
          </p>
        </article>
      </section>
    </div>
  </main>

  <!-- Pie de página -->
</body>

</html>
