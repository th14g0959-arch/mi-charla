<!DOCTYPE html>
<html lang="es-AR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tarjeta · Mi charla</title>

  <!-- Esta sola línea engancha el CSS externo. Sin esto, no se ve nada. -->
  <link rel="stylesheet" href="Pagina.css">
</head>


<body>
  <!--Encabezado-->
  <div class="solucionar-prob">

  <main class="tarjeta">
    <img class="tarjeta__logo" src="./img/Liverpool.png" alt="Logo del Liverpool footbal club">

    <p class="tarjeta__curso">Taller WebI + Clubes TED-Ed</p>
    <h1 class="tarjeta__nombre">Thiago Collihuin</h1>
    <p class="tarjeta__frase">"You never walk alone."</p>
    <p class="tarjeta__autor">Frase que me representa · 4° año</p>

   

    <section class="tarjeta tarjeta--oscura">
      <h2 class="tarjeta__pregunta">Partidos Historicos</h2>
      <p class="tarjeta__respuesta">
        <img src="./img/fondo portada.jpg" height="220"
          alt="Partidos" class="imagenes-liverpool">
      </p>
      <p><a
          href="./primerapag.html"
          class="tarjeta__respuesta--enlace">Entrar</a></p>
    </section>

    <section class="tarjeta tarjeta--oscura">
      <h2 class="tarjeta__pregunta">Explicacion de por que es historico</h2>
      <p class="tarjeta__respuesta"><img src="./img/Explicacion del partido.jpg"
          height="220" alt="ExplicacionPartidos" class="imagenes-liverpool"></p>
      <p><a href="./segundapag.html"
          class="tarjeta__respuesta--enlace">Entrar</a></p>
    </section>

    <section class="tarjeta tarjeta--oscura">
      <h2 class="tarjeta__pregunta">Relacion con mi charla ted</h2>
      <p class="tarjeta__respuesta"><img
          src="" height="220"
          alt="" class="imagenes-liverpool"></p>
      <p><a href="./tercerapag.html"
          class="tarjeta__respuesta--enlace">Entrar</a></p>
    </section>
  </main>
  <!-- pie de pagina-->
   </div>
</body>

</html>
