<!DOCTYPE html>
<html lang="es-AR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tarjeta · Mi charla</title>

  <!-- Esta sola línea engancha el CSS externo. Sin esto, no se ve nada. -->
  <link rel="stylesheet" href="Pagina.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>


<body>
  <!--Encabezado-->
  <main>
    <div class="Contenedor">
      <section class="tarjeta-principal">
        <article class="tarjeta--clara">
          <img class="tarjeta__logo" src="./img/Liverpool.png" alt="Logo del Liverpool Football Club">

          <p class="tarjeta__curso">Taller WebI + Clubes TED-Ed</p>
          <h1 class="tarjeta__nombre">Thiago Collihuin</h1>
          <p class="tarjeta__frase">"You never walk alone."</p>
          <p class="tarjeta__autor">Frase que me representa · 4° año</p>
        </article>
      </section>

      <section class="tarjeta">
        <article class="tarjeta--oscura">
          <h2 class="tarjeta__pregunta">Partidos Históricos</h2>
          <p class="tarjeta__respuesta">
            <img src="./img/fondo portada.jpg" height="220" alt="Partidos" class="imagenes-liverpool">
          </p>
          <p>
            <a href="./primerapag.html" class="tarjeta__respuesta--enlace">Entrar</a>
          </p>
        </article>

        <article class="tarjeta--oscura">
          <h2 class="tarjeta__pregunta">Explicación de por qué es histórico</h2>
          <p class="tarjeta__respuesta">
            <img src="./img/Explicacion del partido.jpg" height="220" alt="Explicación de los partidos"
              class="imagenes-liverpool">
          </p>
          <p>
            <a href="./segundapag.html" class="tarjeta__respuesta--enlace">Entrar</a>
          </p>
        </article>

        <article class="tarjeta--oscura">
          <h2 class="tarjeta__pregunta">Relación con mi charla TED</h2>
          <p class="tarjeta__respuesta">
            <img src="./img/otracharlated.png" height="220" alt="Charla TED" class="imagenes-liverpool">
          </p>
          <p>
            <a href="./tercerapag.html" class="tarjeta__respuesta--enlace">Entrar</a>
          </p>
        </article>
      </section>
    </div>
  </main>

  <!-- Pie de página -->
</body>

</html>
